buildscript {
	dependencies {
		classpath group: "com.liferay", name: "com.liferay.gradle.plugins.defaults", version: "latest.release"
		classpath group: "org.springframework.boot", name: "spring-boot-gradle-plugin", version: "3.3.5"
	}

	repositories {
		maven {
			url "https://repository-cdn.liferay.com/nexus/content/groups/public"
		}
	}
}

apply plugin: "java-library"
apply plugin: "org.springframework.boot"

dependencies {
	implementation group: "com.liferay", name: "com.liferay.client.extension.util.spring.boot3", version: "1.0.8"
	implementation group: "org.json", name: "json", version: "20231013"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-oauth2-client", version: "3.3.5"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-oauth2-resource-server", version: "3.3.5"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-web", version: "3.3.5"
	implementation group: "org.springframework.boot", name: "spring-boot-starter-webflux", version: "3.3.5"
}

repositories {
	maven {
		url "https://repository-cdn.liferay.com/nexus/content/groups/public"
	}
}
